<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Ritweek Dubey, Full Stack Developer</title>
  <desc id="desc">Name banner on a navy background with a path drawn through a grid of dots.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1428"/>
      <stop offset="1" stop-color="#12306B"/>
    </linearGradient>
    <pattern id="dots" x="680" y="30" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.2" fill="#94A3B8" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bg)" stroke="#1E3A8A" stroke-opacity="0.7"/>

  <!-- Grid of dots with a path running through it -->
  <rect x="680" y="30" width="480" height="240" fill="url(#dots)"/>
  <polyline points="700,250 780,250 780,170 860,170 860,90 980,90 980,170 1060,170 1060,90 1140,90"
            fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="700" cy="250" r="9" fill="#0A1428" stroke="#3B82F6" stroke-width="4"/>
  <circle cx="1140" cy="90" r="16" fill="#3B82F6" fill-opacity="0.2"/>
  <circle cx="1140" cy="90" r="8" fill="#3B82F6"/>

  <!-- Text -->
  <text x="72" y="128" fill="#F8FAFC" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Ritweek Dubey</text>
  <rect x="72" y="148" width="56" height="4" rx="2" fill="#3B82F6"/>
  <text x="72" y="196" fill="#E2E8F0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500">Full Stack Developer</text>
  <text x="72" y="232" fill="#94A3B8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20">Building with React and Node.js. Solving problems in C++.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
